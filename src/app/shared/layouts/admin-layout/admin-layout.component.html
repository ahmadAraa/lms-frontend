<div class="hr-layout">

  <!-- Left Sidebar -->
  <aside class="hr-sidebar">
    <a routerLink="/hr/dashboard" class="hr-sidebar-brand">
      <span class="brand-logo-frame" aria-label="EduPro LMS by Advanced Business Solutions">
        <img src="assets/ABS-LOGO.png" alt="EduPro LMS by Advanced Business Solutions" class="brand-logo" />
      </span>
    </a>

    <nav class="hr-sidebar-nav">
      <a routerLink="/hr/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="hr-sidebar-link">
        <span class="material-symbols-outlined">dashboard</span>
        Dashboard
      </a>
      <a routerLink="/hr/create-user" routerLinkActive="active" class="hr-sidebar-link">
        <span class="material-symbols-outlined">group</span>
        Users
      </a>
      <a routerLink="/learning-paths" routerLinkActive="active" class="hr-sidebar-link">
        <span class="material-symbols-outlined">route</span>
        Learning Paths
      </a>
      <a routerLink="/hr/assign-path" routerLinkActive="active" class="hr-sidebar-link">
        <span class="material-symbols-outlined">assignment_ind</span>
        Assign Path
      </a>
      <a routerLink="/hr/assign-course" routerLinkActive="active" class="hr-sidebar-link">
        <span class="material-symbols-outlined">menu_book</span>
        Assign Course
      </a>
      <a routerLink="/hr/team-progress" routerLinkActive="active" class="hr-sidebar-link">
        <span class="material-symbols-outlined">monitoring</span>
        Team Progress
      </a>
    </nav>
    <div class="hr-sidebar-spacer"></div>
    <div class="hr-sidebar-footer">
      <p class="sidebar-copyright">LMS</p>
      <p class="sidebar-sub-copyright">by Advanced Business Solutions</p>
    </div>
  </aside>

  <!-- Main -->
  <div class="hr-main">

    <!-- Top bar -->
    <header class="hr-topbar">
      <div class="hr-topbar-right">
        <app-notification-bell></app-notification-bell>

        <!-- Profile menu -->
        <div class="profile-menu-wrapper" (click)="$event.stopPropagation()">
          <button class="profile-avatar-btn" (click)="toggleProfile($event)" id="profile-menu-btn">
            <span class="profile-avatar">{{ getInitial() }}</span>
            <span class="material-symbols-outlined chevron" [class.open]="profileOpen">expand_more</span>
          </button>

          <div class="profile-dropdown" [class.visible]="profileOpen">
            <div class="profile-dropdown-header">
              <div class="dropdown-avatar">{{ getInitial() }}</div>
              <div>
                <div class="dropdown-name">{{ authService.getUserName() }}</div>
                <div class="dropdown-role">{{ authService.getUserRole() }}</div>
              </div>
            </div>
            <div class="profile-dropdown-divider"></div>
            <button class="profile-dropdown-item" (click)="goToSettings()">
              <span class="material-symbols-outlined">manage_accounts</span>
              User Settings
            </button>
            <button class="profile-dropdown-item danger" (click)="logout()">
              <span class="material-symbols-outlined">logout</span>
              Log Out
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <div class="hr-content-wrapper">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
