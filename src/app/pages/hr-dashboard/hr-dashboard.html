<!-- Content -->
<div class="hr-content stagger-container">

  <!-- Welcome row -->
  <div class="hr-welcome-row">
    <div>
      <h1 class="hr-welcome-title">Welcome back, {{ userName() || 'Admin' }}</h1>
      <p class="hr-welcome-sub">Your workforce learning engagement is up this month.</p>
    </div>
    <a routerLink="/hr/assign-path" class="hr-assign-btn">
      <span class="material-symbols-outlined">add_circle</span>
      Assign Training
    </a>
  </div>

  <!-- Key Metrics Row -->
  <div class="hr-metrics-grid">
    <div class="hr-metric-card">
      <div class="hr-metric-icon-wrapper employee-icon">
        <span class="material-symbols-outlined">group</span>
      </div>
      <div class="hr-metric-content">
        <span class="hr-metric-value">{{ totalEmployees() }}</span>
        <span class="hr-metric-label">Total Employees</span>
      </div>
    </div>

    <div class="hr-metric-card">
      <div class="hr-metric-icon-wrapper path-icon">
        <span class="material-symbols-outlined">schema</span>
      </div>
      <div class="hr-metric-content">
        <span class="hr-metric-value">{{ paths().length }}</span>
        <span class="hr-metric-label">Learning Paths</span>
      </div>
    </div>

    <div class="hr-metric-card">
      <div class="hr-metric-icon-wrapper enrollment-icon">
        <span class="material-symbols-outlined">assignment_turned_in</span>
      </div>
      <div class="hr-metric-content">
        <span class="hr-metric-value">{{ totalEnrollments() }}</span>
        <span class="hr-metric-label">Total Enrollments</span>
      </div>
    </div>
  </div>

  <!-- Learning Path Distribution -->
  <app-learning-path-distribution
    [paths]="paths()"
    [enrolledCounts]="enrolledCounts()"
  ></app-learning-path-distribution>

  <!-- Bottom row: Recent Activity + Quick Actions -->
  <div class="hr-bottom-row">

    <!-- Recent Administrative Activity -->
    <app-recent-activity
      [activities]="activities()"
    ></app-recent-activity>

    <!-- Quick Actions -->
    <app-quick-actions></app-quick-actions>

  </div>
</div>
