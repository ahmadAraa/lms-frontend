<div class="viewer-wrapper">
  <main class="layout">
    <section class="main">
      <app-lesson-content
        [lesson]="lesson()"
        [course]="course()"
        [isLoading]="isLoading()"
        [error]="error()"
        [currentLessonNumber]="currentLessonNumber()"
        [totalLessons]="totalLessons()"
        [nextLessonId]="nextLessonId()"
        [isComplete]="isCurrentLessonComplete()"
        [isPreviewMode]="isPreviewMode()"
        [isCompleting]="isCompleting()"
        [hasNextCourse]="hasNextCourse()"
        [isLastLessonOfCourse]="isLastLessonOfCourse()"
        [isCourseComplete]="isCourseComplete()"
        [courseTitle]="course()?.title || ''"
        (markComplete)="markCurrentComplete($event)"
        (nextLesson)="goToNextLesson()"
        (nextCourse)="goToNextCourse()"
        (back)="goBack()"
        (navigate)="onBreadcrumbNavigate($event)">
      </app-lesson-content>
    </section>

    <app-lesson-sidebar
      [course]="course()"
      [sections]="sections()"
      [expandedSectionIds]="expandedSectionIds()"
      [completedLessonIds]="completedLessonIds()"
      [currentLessonId]="lesson()?.id"
      [isPreviewMode]="isPreviewMode()"
      (toggleSection)="toggleSection($event)"
      (openLesson)="openLesson($event)"
      (toggleCompletion)="toggleCompletion($event)"
      (backToTop)="goBack()">
    </app-lesson-sidebar>
  </main>
</div>
