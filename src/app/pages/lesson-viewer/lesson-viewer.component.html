<div class="viewer-wrapper">
  <main class="layout">
    <section class="main">
      <app-lesson-content 
        [lesson]="lesson()"
        [course]="course()"
        [isLoading]="isLoading()"
        [error]="error()">
      </app-lesson-content>
    </section>

    <app-lesson-sidebar
      [course]="course()"
      [sections]="sections()"
      [expandedSectionIds]="expandedSectionIds()"
      [completedLessonIds]="completedLessonIds()"
      [currentLessonId]="lesson()?.id"
      (toggleSection)="toggleSection($event)"
      (openLesson)="openLesson($event)"
      (toggleCompletion)="toggleCompletion($event)"
      (backToTop)="goBack()">
    </app-lesson-sidebar>
  </main>
</div>
