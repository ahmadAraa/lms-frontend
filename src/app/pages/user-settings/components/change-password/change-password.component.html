<div class="settings-card">
  <div class="settings-card-header">
    <span class="material-symbols-outlined card-icon">lock_reset</span>
    <div>
      <h2 class="card-title">Change Password</h2>
      <p class="card-subtitle">Make sure your new password is strong and unique.</p>
    </div>
  </div>

  <form class="settings-form" (ngSubmit)="onSubmit()" #pwForm="ngForm">

    <!-- Current Password -->
    <div class="form-group">
      <label for="currentPassword" class="form-label">Current Password</label>
      <div class="input-with-eye">
        <input
          id="currentPassword"
          [type]="showCurrent ? 'text' : 'password'"
          class="form-input"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          placeholder="Enter current password"
          autocomplete="current-password"
          required
        />
        <button type="button" class="eye-btn" (click)="showCurrent = !showCurrent" tabindex="-1">
          <span class="material-symbols-outlined">{{ showCurrent ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <!-- New Password -->
    <div class="form-group">
      <label for="newPassword" class="form-label">New Password</label>
      <div class="input-with-eye">
        <input
          id="newPassword"
          [type]="showNew ? 'text' : 'password'"
          class="form-input"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          required
        />
        <button type="button" class="eye-btn" (click)="showNew = !showNew" tabindex="-1">
          <span class="material-symbols-outlined">{{ showNew ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="form-group">
      <label for="confirmPassword" class="form-label">Confirm New Password</label>
      <div class="input-with-eye">
        <input
          id="confirmPassword"
          [type]="showConfirm ? 'text' : 'password'"
          class="form-input"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Repeat new password"
          autocomplete="new-password"
          required
        />
        <button type="button" class="eye-btn" (click)="showConfirm = !showConfirm" tabindex="-1">
          <span class="material-symbols-outlined">{{ showConfirm ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <div class="alert alert-success" *ngIf="successMsg">
      <span class="material-symbols-outlined">check_circle</span>
      {{ successMsg }}
    </div>
    <div class="alert alert-error" *ngIf="errorMsg">
      <span class="material-symbols-outlined">error</span>
      {{ errorMsg }}
    </div>

    <button type="submit" class="btn-primary" [disabled]="isLoading">
      <span *ngIf="!isLoading">Change Password</span>
      <span *ngIf="isLoading" class="spinner"></span>
    </button>
  </form>
</div>
