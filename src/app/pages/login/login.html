<div class="page-wrapper">
  <div class="auth-card">
    <!-- Left: Branding Panel -->

    <!-- Right: Form Panel -->
    <div class="form-panel">
      <div class="auth-logo-container">
        <img src="assets/ABS-LOGO.png" alt="Advanced Business Solutions" class="auth-logo" />
      </div>

      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Please enter your credentials to access the dashboard.</p>
      </div>

      <div class="form-group">
        <label for="email">Work Email</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon-left">mail</span>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="name@university.edu"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a class="forgot-link" routerLink="/forgot-password">Forgot?</a>
        </div>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon-left">lock_person</span>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••••••"
            class="input-with-toggle"
          />
          <button
            type="button"
            class="password-toggle-btn"
            (click)="showPassword = !showPassword"
            [aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="checkbox-row">
        <label class="checkbox-container">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          Remember me on this device
        </label>
      </div>

      @if (errorMessage) {
        <div class="error-alert">{{ errorMessage }}</div>
      }

      <button class="btn-primary" (click)="onLogin()" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In to Dashboard' }}
        <span class="material-symbols-outlined">{{ isLoading ? 'hourglass_empty' : 'arrow_forward' }}</span>
      </button>
    </div>
  </div>
</div>
