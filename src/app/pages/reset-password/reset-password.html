<div class="page-wrapper">
  <div class="auth-card">
    <div class="form-panel">
      <div class="auth-logo-container">
        <img src="assets/ABS-LOGO.png" alt="Advanced Business Solutions" class="auth-logo" />
      </div>

      <div class="form-header">
        <h2>Set New Password</h2>
        <p>Enter your new password below to secure your account.</p>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon-left">lock</span>
          <input
            id="newPassword"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="••••••••••••"
            class="input-with-toggle"
          />
          <button
            type="button"
            class="password-toggle-btn"
            (click)="showPassword = !showPassword"
            [aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <span class="material-symbols-outlined">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon-left">lock_person</span>
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••••••"
            class="input-with-toggle"
          />
          <button
            type="button"
            class="password-toggle-btn"
            (click)="showConfirmPassword = !showConfirmPassword"
            [aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
          >
            <span class="material-symbols-outlined">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <div class="error-alert">{{ errorMessage }}</div>
      }

      @if (successMessage) {
        <div class="success-alert">{{ successMessage }}</div>
      }

      <button class="btn-primary" (click)="onReset()" [disabled]="isLoading">
        @if (isLoading) {
          <span>Resetting...</span>
        } @else {
          <span>Reset Password</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        }
      </button>

      <div class="divider"><span>Remembered it?</span></div>
      <a routerLink="/" class="btn-secondary">Back to Login</a>
    </div>
  </div>
</div>
